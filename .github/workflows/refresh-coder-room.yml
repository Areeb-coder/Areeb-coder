name: Refresh pixel-art room animation

on:
  push:
    branches: [main]
    paths:
      - "README.md"
      - "scripts/animate_room.py"
      - ".github/workflows/refresh-coder-room.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-room-animation
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check Pillow

      - name: Generate fixed-camera ambient GIF
        run: python scripts/animate_room.py

      - name: Commit updated GIF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/coder-room.gif
          if git diff --cached --quiet; then
            echo "No animation changes to commit."
          else
            git commit -m "Refresh fixed-camera pixel-art room animation"
            git push
          fi
