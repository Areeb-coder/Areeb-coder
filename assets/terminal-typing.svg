<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-labelledby="title desc">
<title id="title">Areeb-coder terminal typing animation</title>
<desc id="desc">A terminal window types a clean block-character AREEB-CODER wordmark and a developer-focused tagline.</desc>
<defs>
