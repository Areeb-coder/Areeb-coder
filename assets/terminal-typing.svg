<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="232" viewBox="0 0 1200 232" role="img" aria-labelledby="title desc">
<title id="title">Areeb-coder terminal typing animation</title>
<desc id="desc">The original slanted terminal ASCII wordmark, with extra spacing between the letters in CODER.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#111923"/><stop offset="1" stop-color="#071018"/></linearGradient>
  <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#22d3c5"/><stop offset=".5" stop-color="#4f8ee8"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient>
  <clipPath id="typing"><rect x="30" y="76" width="0" height="120"><animate attributeName="width" values="0;1120;1120;0" keyTimes="0;.58;.88;1" dur="12s" repeatCount="indefinite"/></rect></clipPath>
</defs>
<rect x="2" y="2" width="1196" height="228" rx="16" fill="url(#bg)" stroke="#2a3c4b" stroke-width="2"/>
<path d="M18 2h1164a16 16 0 0 1 16 16v31H2V18A16 16 0 0 1 18 2Z" fill="#1a2531"/>
<circle cx="27" cy="26" r="6" fill="#fb7185"/><circle cx="49" cy="26" r="6" fill="#fbbf24"/><circle cx="71" cy="26" r="6" fill="#4ade80"/>
<text x="600" y="31" text-anchor="middle" fill="#9aa9b7" font-family="monospace" font-size="12">areeb-coder@github: ~</text>
<text x="42" y="69" fill="#70d6b0" font-family="monospace" font-size="15">$ whoami</text>
<g clip-path="url(#typing)">
  <text x="40" y="102" fill="#d9e7ef" font-family="monospace" font-size="19" xml:space="preserve">    _    ____  _____ _____ ____</text>
  <text x="570" y="102" textLength="435" lengthAdjust="spacing" fill="#d9e7ef" font-family="monospace" font-size="19" xml:space="preserve">____ ___  ____  _____ ____</text>
  <text x="40" y="124" fill="#d9e7ef" font-family="monospace" font-size="19" xml:space="preserve">   / \\  |  _ \\| ____| ____| __ )</text>
  <text x="570" y="124" textLength="435" lengthAdjust="spacing" fill="#d9e7ef" font-family="monospace" font-size="19" xml:space="preserve">/ ___/ _ \\|  _ \\| ____|  _ \\</text>
  <text x="40" y="146" fill="#d9e7ef" font-family="monospace" font-size="19" xml:space="preserve">  / _ \\ | |_) |  _| |  _| |  _ \\</text>
  <text x="570" y="146" textLength="435" lengthAdjust="spacing" fill="#d9e7ef" font-family="monospace" font-size="19" xml:space="preserve">| |  | | | | | | |  _| | |_) |</text>
  <text x="40" y="168" fill="#d9e7ef" font-family="monospace" font-size="19" xml:space="preserve"> / ___ \\|  _ &lt;| |___| |___| |_) |</text>
  <text x="570" y="168" textLength="435" lengthAdjust="spacing" fill="#d9e7ef" font-family="monospace" font-size="19" xml:space="preserve">| |__| |_| | |_| | |___|  _ &lt;</text>
  <text x="40" y="190" fill="#d9e7ef" font-family="monospace" font-size="19" xml:space="preserve">/_/   \\_\\_| \\_\\_____|_____|____/</text>
  <text x="570" y="190" textLength="435" lengthAdjust="spacing" fill="#d9e7ef" font-family="monospace" font-size="19" xml:space="preserve">\\____\\___/|____/|_____|_| \\_\\</text>
</g>
<rect x="1100" y="176" width="9" height="15" fill="#70d6b0"><animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;.45;.5;.95;1" dur=".9s" repeatCount="indefinite"/></rect>
<text x="77" y="216" fill="#7f93a2" font-family="monospace" font-size="12">AI engineering  ·  product building  ·  developer tools  ·  competitive programming</text>
<rect x="3" y="3" width="1194" height="226" rx="15" fill="none" stroke="url(#edge)" stroke-opacity=".4"/>
</svg>