  <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#22d3c5"/><stop offset=".5" stop-color="#4f8ee8"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient>
  <clipPath id="typing"><rect x="40" y="82" width="0" height="172"><animate attributeName="width" values="0;0;820;820;0" keyTimes="0;.08;.76;.92;1" dur="12s" repeatCount="indefinite"/></rect></clipPath>
</defs>
<rect x="2" y="2" width="1196" height="276" rx="16" fill="url(#bg)" stroke="#2a3c4b" stroke-width="2"/>
